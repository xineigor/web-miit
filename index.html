<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание УВП-311</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        :root {
            --md-sys-color-background: #000000;
            --md-sys-color-on-background: #E6E1E5;
            --md-sys-color-surface: #141218;
            --md-sys-color-surface-container: #1D1B20;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-tertiary: #EFB8C8;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-error: #F2B8B5;
            --font-family: 'Roboto', sans-serif;
            --color-time-text: #D0BCFF;
        }

        body.light-theme {
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #F3EDF7;
            --md-sys-color-surface-container: #E7E0EC;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-tertiary: #7D5260;
            --color-time-text: #6750A4;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 { margin: 0; font-size: 22px; font-weight: 700; }
        .header-title p { margin: 0; font-size: 14px; color: var(--md-sys-color-outline); }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-accent {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 10px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer; color: var(--md-sys-color-on-background); padding: 8px;
        }

        /* Date Strip */
        .date-strip { display: flex; justify-content: space-between; padding: 10px 16px; }
        .date-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 48px; height: 70px; border-radius: 24px; cursor: pointer; transition: 0.3s;
        }
        .date-item.active { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .date-item .day-name { font-size: 12px; margin-bottom: 4px; }
        .date-item .day-num { font-size: 18px; font-weight: 500; }
        .date-dots { font-size: 8px; line-height: 4px; letter-spacing: -2px; margin-top: 4px; opacity: 0.6; }

        /* Schedule Content */
        .schedule-container { flex: 1; overflow-y: auto; padding: 0 16px 32px 16px; }
        .week-info { text-align: center; font-size: 14px; margin: 10px 0 20px 0; display: flex; justify-content: space-between; align-items: center; }

        .lesson-card-wrapper { margin-bottom: 24px; }
        .lesson-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-time-text); font-weight: 500; margin-bottom: 6px; padding: 0 4px; }
        .lesson-card { background-color: var(--md-sys-color-surface-container); border-radius: 24px; padding: 16px; position: relative; }
        .lesson-type { font-size: 12px; color: var(--md-sys-color-outline); margin-bottom: 4px; }
        .lesson-title { font-size: 17px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; padding-right: 30px; }
        .lesson-details { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--md-sys-color-outline); }
        .detail-row { display: flex; align-items: flex-start; gap: 8px; }
        .detail-row .material-symbols-outlined { font-size: 16px; margin-top: 2px; }

        .note-preview {
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--md-sys-color-outline-variant);
            font-size: 14px; color: var(--md-sys-color-tertiary); font-style: italic; display: none;
        }
        .note-preview.has-note { display: block; }
        .edit-note-btn { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--md-sys-color-outline); cursor: pointer; }

        /* Modals */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: auto; }
        .modal { background: var(--md-sys-color-surface-container-high); width: 90%; max-width: 400px; border-radius: 28px; padding: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--md-sys-color-primary); }
        .input-group input, .input-group textarea {
            width: 100%; background: var(--md-sys-color-surface); border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface); padding: 12px; border-radius: 12px; font-family: inherit; font-size: 16px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .btn { border: none; padding: 10px 24px; border-radius: 20px; font-weight: 500; cursor: pointer; }
        .btn-text { background: none; color: var(--md-sys-color-primary); }
        .btn-filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .btn-danger { color: var(--md-sys-color-error); background: none; margin-right: auto; }

        .toast {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: var(--md-sys-color-on-surface); color: var(--md-sys-color-surface);
            padding: 12px 24px; border-radius: 50px; font-size: 14px; opacity: 0; z-index: 2000; transition: 0.3s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>УВП-311</h1>
            <p>Периодическое</p>
        </div>
        <div class="header-actions">
            <button class="btn-accent" onclick="openGitSettings()">
                <span class="material-symbols-outlined">sync</span> GitHub
            </button>
            <button class="icon-btn" onclick="toggleTheme()">
                <span class="material-symbols-outlined">dark_mode</span>
            </button>
        </div>
    </header>

    <div class="date-strip" id="dateStrip"></div>

    <div class="schedule-container">
        <div class="week-info">
            <span class="material-symbols-outlined">chevron_left</span>
            <span>Февраль • неделя 2</span>
            <span class="material-symbols-outlined">chevron_right</span>
        </div>
        <div id="scheduleContent"></div>
    </div>

    <!-- Modals (Git & Notes) -->
    <div class="modal-backdrop" id="gitModal">
        <div class="modal">
            <h2>Настройки GitHub</h2>
            <p style="font-size: 13px; color: var(--md-sys-color-outline);">Используйте <b>Fine-grained PAT</b> с правами на 'Contents' (Read/Write) для выбранного репозитория.</p>
            <div class="input-group"><label>Username</label><input type="text" id="gitOwner" placeholder="Логин GitHub"></div>
            <div class="input-group"><label>Repository</label><input type="text" id="gitRepo" placeholder="напр. my-notes"></div>
            <div class="input-group"><label>Token (Fine-grained)</label><input type="password" id="gitToken" placeholder="github_pat_..."></div>
            <div class="modal-actions">
                <button class="btn btn-text" onclick="closeGitSettings()">Отмена</button>
                <button class="btn btn-filled" onclick="saveGitSettings()">Подключить</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="noteModal">
        <div class="modal">
            <h2 id="noteSubjectTitle">Заметка</h2>
            <div class="input-group"><textarea id="noteText" placeholder="Текст заметки..."></textarea></div>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="clearNote()">Удалить</button>
                <button class="btn btn-text" onclick="closeNoteModal()">Отмена</button>
                <button class="btn btn-filled" id="btnSaveNote">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const scheduleData = {
            0: [ // Понедельник
                { id: "mon_7", num: "7 пара", time: "18:30 - 19:50", type: "Лабораторная работа", title: "Программирование на языке C#", loc: "Аудитория 1140", prof: "Заманов Д.А. Сердюков И.А." },
                { id: "mon_8", num: "8 пара", time: "20:00 - 21:20", type: "Практическое занятие", title: "Системы искусственного интеллекта и машинное обучение", loc: "Аудитория 2422", prof: "Зольникова Н.Н." }
            ],
            1: [ // Вторник
                { id: "tue_5", num: "5 пара", time: "15:20 - 16:40", type: "Лекция", title: "Асинхронное и параллельное программирование", loc: "Аудитория 1541", prof: "Заманова Е.А.", groups: "УВП-311 УВП-312 УИТ-311" },
                { id: "tue_6", num: "6 пара", time: "16:55 - 18:15", type: "Лекция", title: "Разработка веб-приложений", loc: "Аудитория 1323", prof: "Заманова Е.А.", groups: "УВП-311 УВП-312 УИТ-311" },
                { id: "tue_7", num: "7 пара", time: "18:30 - 19:50", type: "Практическое занятие", title: "Проектная деятельность", loc: "Аудитория 1142", prof: "Долиняк М.С. Федосеев П.А." }
            ],
            2: [ // Среда
                { id: "wed_5", num: "5 пара", time: "15:20 - 16:40", type: "Лабораторная работа", title: "Сетевые технологии и протоколы", loc: "Аудитория 1325", prof: "Колосницын Г.Л. Хамаза А.С." },
                { id: "wed_6", num: "6 пара", time: "16:55 - 18:15", type: "Лекция", title: "Сервис-ориентированное программирование", loc: "Аудитория 1541", prof: "Заманов Е.А.", groups: "УВП-311 УВП-312 УИТ-311" }
            ],
            3: [ // Четверг
                { id: "thu_5", num: "5 пара", time: "15:20 - 16:40", type: "Практическое занятие", title: "Сервис-ориентированное программирование", loc: "Аудитория 1140", prof: "Заманов Д.А." },
                { id: "thu_6", num: "6 пара", time: "16:55 - 18:15", type: "Лекция", title: "Сетевые технологии и протоколы", loc: "Аудитория 1540", prof: "Хамаза А.С.", groups: "УВП-311 УВП-312 УИТ-311" },
                { id: "thu_7", num: "7 пара", time: "18:30 - 19:50", type: "Лекция", title: "Администрирование ОС Linux", loc: "Аудитория 1541", prof: "Бойков П.А.", groups: "УВП-311 УВП-312 УИТ-311" }
            ],
            4: [ // Пятница
                { id: "fri_1", num: "1 пара", time: "08:30 - 09:50", type: "Лекция", title: "Системы искусственного интеллекта и машинное обучение", loc: "Аудитория 1541", prof: "Зольникова Н.Н.", groups: "УВП-311 УВП-312 УИТ-311" },
                { id: "fri_2", num: "2 пара", time: "10:05 - 11:25", type: "Практическое занятие", title: "Администрирование ОС Linux", loc: "Аудитория 1319", prof: "Бойков П.А." },
                { id: "fri_3", num: "3 пара", time: "11:40 - 13:00", type: "Практическое занятие", title: "Системы искусственного интеллекта и машинное обучение", loc: "Аудитория 4422", prof: "Зольникова Н.Н." },
                { id: "fri_4", num: "4 пара", time: "13:45 - 15:05", type: "Лабораторная работа", title: "Разработка веб-приложений", loc: "Аудитория 1325", prof: "Заманова Е.А. Сердюкова П.М." },
                { id: "fri_5", num: "5 пара", time: "15:20 - 16:40", type: "Лабораторная работа", title: "Асинхронное и параллельное программирование", loc: "Аудитория 1321", prof: "Заманова Е.А. Мамонов Н.Ю." }
            ]
        };

        const days = [{n:"пн", d:9, i:0}, {n:"вт", d:10, i:1}, {n:"ср", d:11, i:2}, {n:"чт", d:12, i:3}, {n:"пт", d:13, i:4}];
        let currentDay = 0, notesDB = {}, gitConfig = { owner: '', repo: '', token: '' };
        const FILENAME = 'notes_db.json';

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('uvp311_git_config');
            if(saved) {
                gitConfig = JSON.parse(saved);
                document.getElementById('gitOwner').value = gitConfig.owner;
                document.getElementById('gitRepo').value = gitConfig.repo;
                document.getElementById('gitToken').value = gitConfig.token;
                fetchNotesFromGit();
            }
            renderDateStrip();
            renderSchedule();
        });

        function renderDateStrip() {
            document.getElementById('dateStrip').innerHTML = days.map(d => `
                <div class="date-item ${d.i === currentDay ? 'active' : ''}" onclick="currentDay=${d.i};renderDateStrip();renderSchedule();">
                    <span class="day-name">${d.n}</span>
                    <span class="day-num">${d.d}</span>
                    <span class="date-dots">••</span>
                </div>
            `).join('');
        }

        function renderSchedule() {
            const lessons = scheduleData[currentDay] || [];
            document.getElementById('scheduleContent').innerHTML = lessons.map(l => {
                const note = notesDB[l.id] || "";
                return `
                <div class="lesson-card-wrapper">
                    <div class="lesson-meta"><span>${l.num}</span><span>${l.time}</span></div>
                    <div class="lesson-card">
                        <button class="edit-note-btn" onclick="openNoteEditor('${l.id}', '${l.title}')"><span class="material-symbols-outlined">edit_note</span></button>
                        <div class="lesson-type">${l.type}</div>
                        <div class="lesson-title">${l.title}</div>
                        <div class="lesson-details">
                            ${l.groups ? `<div class="detail-row"><span class="material-symbols-outlined">groups</span> ${l.groups}</div>` : ''}
                            <div class="detail-row"><span class="material-symbols-outlined">location_on</span> ${l.loc}</div>
                            <div class="detail-row"><span class="material-symbols-outlined">school</span> ${l.prof}</div>
                        </div>
                        <div class="note-preview ${note?'has-note':''}"><span class="material-symbols-outlined" style="font-size:14px; vertical-align:middle;">sticky_note_2</span> ${note}</div>
                    </div>
                </div>`;
            }).join('');
        }

        const b64 = {
            enc: (s) => btoa(unescape(encodeURIComponent(s))),
            dec: (s) => decodeURIComponent(escape(atob(s)))
        };

        async function fetchNotesFromGit() {
            if(!gitConfig.token) return;
            try {
                const r = await fetch(`https://api.github.com/repos/${gitConfig.owner}/${gitConfig.repo}/contents/${FILENAME}`, {
                    headers: { 'Authorization': `Bearer ${gitConfig.token}` }
                });
                if(r.ok) {
                    const d = await r.json();
                    notesDB = JSON.parse(b64.dec(d.content));
                    renderSchedule();
                }
            } catch(e) { console.error(e); }
        }

        async function pushNotesToGit() {
            if(!gitConfig.token) return;
            const url = `https://api.github.com/repos/${gitConfig.owner}/${gitConfig.repo}/contents/${FILENAME}`;
            let sha = null;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${gitConfig.token}` } });
                if(res.ok) sha = (await res.json()).sha;
                
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${gitConfig.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update notes", content: b64.enc(JSON.stringify(notesDB)), sha })
                });
                if(putRes.ok) showToast("Облако обновлено");
            } catch(e) { showToast("Ошибка синхронизации"); }
        }

        function openNoteEditor(id, title) {
            currentEditingId = id;
            document.getElementById('noteSubjectTitle').textContent = title;
            document.getElementById('noteText').value = notesDB[id] || "";
            document.getElementById('noteModal').classList.add('open');
            document.getElementById('btnSaveNote').onclick = () => {
                const val = document.getElementById('noteText').value.trim();
                if(val) notesDB[id] = val; else delete notesDB[id];
                document.getElementById('noteModal').classList.remove('open');
                renderSchedule();
                pushNotesToGit();
            };
        }

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function openGitSettings() { document.getElementById('gitModal').classList.add('open'); }
        function closeGitSettings() { document.getElementById('gitModal').classList.remove('open'); }
        function clearNote() { document.getElementById('noteText').value = ""; }
        function closeNoteModal() { document.getElementById('noteModal').classList.remove('open'); }
        function showToast(m) {
            const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        function saveGitSettings() {
            gitConfig = {
                owner: document.getElementById('gitOwner').value.trim(),
                repo: document.getElementById('gitRepo').value.trim(),
                token: document.getElementById('gitToken').value.trim()
            };
            localStorage.setItem('uvp311_git_config', JSON.stringify(gitConfig));
            closeGitSettings();
            fetchNotesFromGit();
        }
    </script>
</body>
</html>
